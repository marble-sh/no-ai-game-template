# Friday timer: standup digest on the pinned issue (#1).
# Replaces its own previous comment to stay tidy.

name: standup-nudge

on:
  schedule:
    - cron: "0 20 * * 5" # Fridays, 17:00 UTC-3 — adjust if you move
  workflow_dispatch:

permissions:
  issues: write

jobs:
  nudge:
    runs-on: ubuntu-24.04
    steps:
      - name: Post the digest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail

          # Nothing to nudge until the backlog exists (scripts/setup-backlog.sh).
          if ! gh issue view 1 --json number >/dev/null 2>&1; then
            echo "Issue #1 does not exist yet — run scripts/setup-backlog.sh first. Skipping."
            exit 0
          fi

          week_ago=$(date -u -d '7 days ago' +%Y-%m-%d)
          moved=$(gh issue list --state closed --search "closed:>=$week_ago" --json number --jq 'length')
          ready=$(gh issue list --state open --label ready --json number --jq 'length')
          wip=$(gh issue list --state open --assignee "$OWNER" --json number --jq 'length')

          gh api "repos/$GH_REPO/issues/1/comments?per_page=100" \
            --jq '.[] | select(.user.login == "github-actions[bot]") | select(.body | startswith("🗓")) | .id' |
          while read -r id; do
            gh api -X DELETE "repos/$GH_REPO/issues/comments/$id"
          done

          body=$(printf '🗓 **Standup Friday** — open your editor and say `standup`.\n\n_moved this week: %s · ready: %s · in progress: %s_' "$moved" "$ready" "$wip")
          gh issue comment 1 --body "$body"
